<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>勤怠打刻</title>
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#1e5aa8" />
</head>
<body>

<div id="conn-banner" class="conn-banner hidden" role="status"></div>

<main id="screen-list" class="screen">
  <header class="clock-header">
    <p class="clock-label">現在時刻</p>
    <p class="clock-time" id="clock-time">--:--</p>
    <p class="clock-date" id="clock-date"></p>
  </header>

  <div class="list-body">
    <p class="list-instruction">あなたの名前をタッチして打刻してください</p>
    <input id="search-input" type="search" placeholder="名前で検索" autocomplete="off" />
    <div id="staff-grid" class="staff-grid" aria-live="polite">
      <p class="loading">読み込み中...</p>
    </div>
    <p class="list-footer">名前が見つからない場合は、スタッフにお声がけください</p>
  </div>

  <a href="/admin/" class="admin-link" aria-label="管理者用">⚙</a>
</main>

<div id="screen-confirm" class="overlay hidden" role="dialog" aria-modal="true">
  <div class="dialog">
    <p class="dialog-name" id="confirm-name"></p>
    <p class="dialog-question"><span id="confirm-type-label"></span>で合っていますか？</p>
    <div class="toggle-row">
      <button type="button" class="toggle-btn" id="confirm-toggle">出勤／退勤を切り替える</button>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary" id="confirm-cancel">戻る</button>
      <button type="button" class="btn btn-primary" id="confirm-ok">はい</button>
    </div>
  </div>
</div>

<div id="screen-camera" class="overlay hidden">
  <div class="camera-wrap">
    <video id="camera-video" autoplay playsinline muted></video>
    <div id="camera-flash" class="camera-flash"></div>
    <p class="camera-caption">撮影中です...</p>
  </div>
</div>

<div id="screen-done" class="overlay hidden">
  <div class="done-wrap">
    <div class="done-check" id="done-check">✓</div>
    <p class="done-name" id="done-name"></p>
    <p class="done-message" id="done-message"></p>
    <p class="done-time" id="done-time"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
